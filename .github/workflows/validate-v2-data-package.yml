name: Validate V2 Data Package

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build test package
        run: python3 scripts/build_test_package.py --keep-sqlite

      - name: Validate test package
        run: python3 scripts/validate_test_package.py
