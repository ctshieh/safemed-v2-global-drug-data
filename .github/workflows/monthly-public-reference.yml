name: Monthly public medicine reference candidate
on:
  schedule:
    - cron: '17 1 18 * *'
  workflow_dispatch:
    inputs:
      reuse_verified_archives:
        description: Repackage the verified 2026-10-08 official snapshots without claiming a fresh retrieval (manual recovery only)
        type: boolean
        default: false
      initialize_logical_candidate:
        description: Explicit first unreviewed logical ledger proposal only; never human medical or production ID approval
        type: boolean
        default: false
defaults:
  run:
    shell: bash
permissions:
  contents: write
  actions: write
concurrency:
  group: monthly-public-reference
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  cadence:
    runs-on: ubuntu-24.04
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - id: gate
        env:
          INTERVAL: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          due=$(python scripts/build_public_reference_bundle.py --check-schedule --interval "$INTERVAL")
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then due=true; fi
          if [ "${{ github.event_name }}" = schedule ] && [ "$due" = true ]; then
            last=''
            for run in $(gh run list --workflow monthly-public-reference.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
              found=$(gh api "repos/${{ github.repository }}/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "PUBLIC-REFERENCE-MANIFEST" and .expired == false) | .id')
              if [ -n "$found" ]; then
                last=$(gh run view "$run" --json updatedAt --jq .updatedAt)
                break
              fi
            done
            LAST_SUCCESS="$last" python - <<'PYCODE' > month-comparison.txt
          import datetime as dt, os
          from zoneinfo import ZoneInfo
          text=os.environ.get('LAST_SUCCESS','')
          previous=dt.datetime.fromisoformat(text.replace('Z','+00:00')).astimezone(ZoneInfo('Asia/Taipei')) if text else None
          now=dt.datetime.now(ZoneInfo('Asia/Taipei'))
          print('true' if previous and (previous.year,previous.month)==(now.year,now.month) else 'false')
          PYCODE
            if [ "$(cat month-comparison.txt)" = true ]; then
              due=false
              echo 'A successful candidate build already exists this Taipei calendar month; scheduled duplicate skipped.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
  build:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MHLW_PRICE_LIST_PAGE: ${{ vars.MHLW_PRICE_LIST_PAGE }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_COLLECTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives && 'VERIFIED_20261008_ARCHIVES' || 'LIVE_OFFICIAL_EXPORTS' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.12'
      - name: Prepare evidence directory
        run: |
          mkdir -p evidence
          created=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at)
          epoch=$(CREATED="$created" python -c 'import datetime,os; print(int(datetime.datetime.fromisoformat(os.environ["CREATED"].replace("Z","+00:00")).timestamp()))')
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          SOURCE_DATE_EPOCH="$epoch" python - <<'PYCODE' > evidence/build-context.json
          import json,os,platform,sqlite3
          print(json.dumps({'SOURCE_DATE_EPOCH':os.environ['SOURCE_DATE_EPOCH'],'GITHUB_SHA':os.environ['GITHUB_SHA'],'GITHUB_RUN_ID':os.environ['GITHUB_RUN_ID'],'SOURCE_COLLECTION_MODE':os.environ['SOURCE_COLLECTION_MODE'],'python':platform.python_version(),'sqlite':sqlite3.sqlite_version},indent=2))
          PYCODE
      - name: Verify retention and fail-closed gates
        run: |
          python scripts/test_monthly_pipeline.py
          python scripts/test_seven_market_builder.py
          python scripts/test_reference_archive_limits.py
          python scripts/test_reconcile_logical_candidate.py
          python scripts/test_reconcile_original_source_rows.py
          python scripts/test_build_logical_runtime_candidate.py
          python scripts/test_strategy_fixture.py
          python scripts/test_measure_schema_layout.py
          python scripts/test_measure_logical_candidate.py
          python scripts/test_public_reference_bundle.py
          python scripts/test_tfda_intake.py
          python scripts/test_international_intake.py
          python scripts/test_france_intake.py
          python scripts/test_japan_korea_intake.py
          python scripts/test_duplicate_audit.py
          python contracts/global-drug-data/1.0.0/generate_fields.py --check
      - name: Retrieve complete declared-reuse official exports
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives) }}
        run: |
          mkdir -p evidence
          python scripts/ingest_tfda_open_data.py --output-dir inputs/TW 2>&1 | tee evidence/TW.log
          python scripts/ingest_international_open_data.py --output-dir inputs/CA-EMA 2>&1 | tee evidence/CA-EMA.log
          python scripts/ingest_france_public_data.py --output-dir inputs/FR 2>&1 | tee evidence/FR.log
          python scripts/ingest_japan_korea_public_data.py --country JP --output-dir inputs/JP 2>&1 | tee evidence/JP.log
          python scripts/ingest_japan_korea_public_data.py --country KR --output-dir inputs/KR 2>&1 | tee evidence/KR.log
      - name: Recover verified TW archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37650795312
          name: TW-OPEN-DATA-UNREVIEWED-37650795312-1
          path: inputs/TW
      - name: Recover verified CA-EMA archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37651829456
          name: CA-EMA-OPEN-DATA-UNREVIEWED-37651829456-1
          path: inputs/CA-EMA
      - name: Recover verified FR archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37651829456
          name: FR-OPEN-DATA-UNREVIEWED-37651829456-1
          path: inputs/FR
      - name: Recover verified JP archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37697632621
          name: JP-OPEN-DATA-UNREVIEWED-37697632621-1
          path: inputs/JP
      - name: Recover verified KR archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37697632621
          name: KR-OPEN-DATA-UNREVIEWED-37697632621-1
          path: inputs/KR
      - name: Retrieve previous successful manifest when available
        run: |
          previous=''
          for run in $(gh run list --workflow monthly-public-reference.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            found=$(gh api "repos/${{ github.repository }}/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "PUBLIC-REFERENCE-MANIFEST" and .expired == false) | .id')
            if [ -n "$found" ]; then previous=$run; break; fi
          done
          if [ -n "$previous" ]; then
            if gh run download "$previous" --name PUBLIC-REFERENCE-MANIFEST --dir previous; then
              echo "PREVIOUS_MANIFEST=previous/manifest.json" >> "$GITHUB_ENV"
            else
              echo 'Previous manifest unavailable; mark baseline absent, never invent a delta.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Audit all rows and assemble candidate bundle
        run: |
          args=()
          if [ -n "${PREVIOUS_MANIFEST:-}" ]; then args+=(--previous "$PREVIOUS_MANIFEST"); fi
          python scripts/build_public_reference_bundle.py --input-root inputs --output-dir dist/public-reference "${args[@]}" 2>&1 | tee evidence/build.log
          python scripts/build_country_matrix.py --bundle-dir dist/public-reference
          python scripts/verify_public_reference_bundle.py --bundle-dir dist/public-reference 2>&1 | tee evidence/verify.log
          cat dist/public-reference/duplicate-audit/DUPLICATE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo 'Reference archive assembled; the following stage adds US/JP/KR/AU to the seven-market unsigned candidate. No formal App manifest or activation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PUBLIC-REFERENCE-UNREVIEWED-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/public-reference/PUBLIC-REFERENCE-UNREVIEWED.tar.gz
            dist/public-reference/archive-sha256.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: PUBLIC-REFERENCE-MANIFEST
          path: |
            dist/public-reference/manifest.json
            dist/public-reference/APP_SOURCE_CATALOG.json
            dist/public-reference/archive-sha256.json
            dist/public-reference/verification.json
            dist/public-reference/original-row-reconciliation.json
            dist/public-reference/COUNTRY_SOURCE_MATRIX.json
          retention-days: 90
          if-no-files-found: error

      - name: Retrieve previous logical candidate ledger when available
        run: |
          recovered=false
          if [ "$(python scripts/monthly_release.py has-monthly --repo '${{ github.repository }}')" = true ]; then
            python scripts/monthly_release.py previous --repo '${{ github.repository }}' --root previous-logical
            echo 'PREVIOUS_LOGICAL=previous-logical/checkpoint.sqlite3' >> "$GITHUB_ENV"
            recovered=true
          else
          for run in $(gh run list --workflow monthly-public-reference.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            found=$(gh api "repos/${{ github.repository }}/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "LOGICAL-RUNTIME-CANDIDATE") | [.id,.expired] | @tsv')
            if [ -n "$found" ]; then
              if echo "$found" | grep -q true; then
                echo 'Previous candidate ledger expired; refusing to silently reset stable IDs.' >&2
                exit 1
              fi
              gh run download "$run" --name LOGICAL-RUNTIME-CANDIDATE --dir previous-logical
              echo 'PREVIOUS_LOGICAL=previous-logical/snapshot.sqlite3' >> "$GITHUB_ENV"
              recovered=true
              break
            fi
            built=$(gh run view "$run" --json jobs --jq '[.jobs[].steps[] | select(.name == "Build isolated real-source logical 29-table candidate" and .conclusion == "success")] | length')
            if [ "$built" -gt 0 ]; then
              echo 'Previous successful logical build has no artifact; refusing ledger reset.' >&2
              exit 1
            fi
          done
          fi
          if [ "$recovered" != true ] && [ '${{ github.event_name == 'workflow_dispatch' && inputs.initialize_logical_candidate }}' != true ]; then
            echo 'No previous ledger recovered. First candidate requires explicit manual initialize_logical_candidate=true; scheduled resets are prohibited.' >&2
            exit 1
          fi
      - name: Build isolated real-source logical 29-table candidate
        run: |
          args=()
          if [ -n "${PREVIOUS_LOGICAL:-}" ]; then args+=(--previous "$PREVIOUS_LOGICAL"); fi
          python scripts/build_logical_runtime_candidate.py --monthly --inputs inputs --output dist/logical-candidate --version "candidate-${{ github.run_id }}-${{ github.run_attempt }}" "${args[@]}" 2>&1 | tee evidence/logical-build.log
          python scripts/reconcile_logical_candidate.py --inputs inputs --candidate dist/logical-candidate/snapshot.sqlite3 --output-dir evidence/logical-row-reconciliation 2>&1 | tee evidence/logical-row-reconciliation.log
          python scripts/measure_schema_layout.py --physical-layout compact-source-v1 --sqlite dist/logical-candidate/snapshot.sqlite3 --output evidence/logical-schema.json
          python scripts/measure_logical_candidate.py --sqlite dist/logical-candidate/snapshot.sqlite3 --gzip dist/logical-candidate/snapshot.sqlite3.gz --output evidence/logical-measurements.json 2>&1 | tee evidence/logical-measurements.log
      - name: Retrieve additional official markets and build source-native projections
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives) }}
        run: python scripts/collect_additional_markets.py --inputs inputs --intermediate intermediate 2>&1 | tee evidence/additional-markets.log
      - name: Produce exact Foundation alias keys without building the App
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives) }}
        run: |
          swift --version | tee evidence/producer-swift-version.txt
          python scripts/prepare_producer_normalization.py --base dist/logical-candidate/snapshot.sqlite3 --config intermediate/GLOBAL_INPUTS.json --output normalization-inputs.json
          swiftc scripts/ProducerNormalization.swift -o producer-normalization
          ./producer-normalization normalization-inputs.json normalization-reference.json
      - name: Build and verify full seven-market candidate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives) }}
        run: |
          created=$(python -c 'import datetime,os; print(datetime.datetime.fromtimestamp(int(os.environ["SOURCE_DATE_EPOCH"]),datetime.timezone.utc).isoformat())')
          python scripts/build_seven_market_candidate.py --base dist/logical-candidate/snapshot.sqlite3 --inputs intermediate/GLOBAL_INPUTS.json --reference normalization-reference.json --output dist/global-candidate --version "candidate-${{ github.run_id }}-${{ github.run_attempt }}" --created-at "$created" 2>&1 | tee evidence/global-build.log
          args=()
          if [ -n "${PREVIOUS_LOGICAL:-}" ]; then args+=(--previous "$PREVIOUS_LOGICAL"); fi
          python scripts/verify_monthly_candidate.py --root dist/global-candidate --config intermediate/GLOBAL_INPUTS.json "${args[@]}" 2>&1 | tee evidence/global-verification.log
      - name: Archive complete sources, notices, transformations and verification
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives) }}
        run: |
          # A tar stream is split into <2GB Release assets; no second giant local tar.
          tar -czf - inputs intermediate evidence dist/logical-candidate/METADATA_EXACT.jsonl.gz dist/global-candidate/source-archive normalization-reference.json | split -b 1000000000 -d - dist/global-candidate/sources.tar.gz.part-
      - name: Build isolated TEST_ONLY unknown-composition fixture
        run: python scripts/build_strategy_fixture.py --output-dir dist/TEST_ONLY-fixture
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: TEST_ONLY-NOT-PRODUCTION-${{ github.run_id }}
          path: dist/TEST_ONLY-fixture/
          retention-days: 90
          if-no-files-found: error
      - name: Preserve logs and partial sources on success or failure
        if: always()
        run: |
          mkdir -p evidence
          python --version > evidence/python-version.txt
          git rev-parse HEAD > evidence/commit.txt
          echo '${{ job.status }}' > evidence/job-status.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: BUILD-EVIDENCE-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/
            inputs/
            dist/logical-candidate/*.json
          retention-days: 90
          if-no-files-found: error

      - name: Publish verified unsigned monthly candidate then retain two successful months
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives) }}
        run: python scripts/monthly_release.py publish --repo '${{ github.repository }}' --root dist/global-candidate --commit '${{ github.sha }}' 2>&1 | tee evidence/monthly-publish.log

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: FAILED-LOGICAL-CANDIDATE-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/global-candidate/*.json
          retention-days: 90
          if-no-files-found: ignore
