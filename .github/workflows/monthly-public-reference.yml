name: Monthly public medicine reference candidate
on:
  schedule:
    - cron: '17 1 8 * *'
  workflow_dispatch:
    inputs:
      reuse_verified_archives:
        description: Repackage the verified 2026-10-08 official snapshots without claiming a fresh retrieval (manual recovery only)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: monthly-public-reference
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.gate.outputs.due }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        env:
          INTERVAL: ${{ vars.PUBLIC_DATA_UPDATE_INTERVAL_MONTHS || '1' }}
        run: |
          due=$(python scripts/build_public_reference_bundle.py --check-schedule --interval "$INTERVAL")
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then due=true; fi
          echo "due=$due" >> "$GITHUB_OUTPUT"
  build:
    needs: cadence
    if: needs.cadence.outputs.due == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MHLW_PRICE_LIST_PAGE: ${{ vars.MHLW_PRICE_LIST_PAGE }}
      GH_TOKEN: ${{ github.token }}
      SOURCE_COLLECTION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives && 'VERIFIED_20261008_ARCHIVES' || 'LIVE_OFFICIAL_EXPORTS' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify retention and fail-closed gates
        run: |
          python scripts/test_public_reference_bundle.py
          python scripts/test_tfda_intake.py
          python scripts/test_international_intake.py
          python scripts/test_france_intake.py
          python scripts/test_japan_korea_intake.py
          python scripts/test_duplicate_audit.py
          python contracts/global-drug-data/1.0.0/generate_fields.py --check
      - name: Retrieve complete declared-reuse official exports
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives) }}
        run: |
          python scripts/ingest_tfda_open_data.py --output-dir inputs/TW
          python scripts/ingest_international_open_data.py --output-dir inputs/CA-EMA
          python scripts/ingest_france_public_data.py --output-dir inputs/FR
          python scripts/ingest_japan_korea_public_data.py --country JP --output-dir inputs/JP
          python scripts/ingest_japan_korea_public_data.py --country KR --output-dir inputs/KR
      - name: Recover verified TW archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37650795312
          name: TW-OPEN-DATA-UNREVIEWED-37650795312-1
          path: inputs/TW
      - name: Recover verified CA-EMA archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37651829456
          name: CA-EMA-OPEN-DATA-UNREVIEWED-37651829456-1
          path: inputs/CA-EMA
      - name: Recover verified FR archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37651829456
          name: FR-OPEN-DATA-UNREVIEWED-37651829456-1
          path: inputs/FR
      - name: Recover verified JP archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37697632621
          name: JP-OPEN-DATA-UNREVIEWED-37697632621-1
          path: inputs/JP
      - name: Recover verified KR archive without changing source retrieval date
        if: github.event_name == 'workflow_dispatch' && inputs.reuse_verified_archives
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 37697632621
          name: KR-OPEN-DATA-UNREVIEWED-37697632621-1
          path: inputs/KR
      - name: Retrieve previous successful manifest when available
        run: |
          previous=''
          for run in $(gh run list --workflow monthly-public-reference.yml --branch main --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            found=$(gh api "repos/${{ github.repository }}/actions/runs/$run/artifacts" --jq '.artifacts[] | select(.name == "PUBLIC-REFERENCE-MANIFEST" and .expired == false) | .id')
            if [ -n "$found" ]; then previous=$run; break; fi
          done
          if [ -n "$previous" ]; then
            if gh run download "$previous" --name PUBLIC-REFERENCE-MANIFEST --dir previous; then
              echo "PREVIOUS_MANIFEST=previous/manifest.json" >> "$GITHUB_ENV"
            else
              echo 'Previous manifest unavailable; mark baseline absent, never invent a delta.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - name: Audit all rows and assemble candidate bundle
        run: |
          args=()
          if [ -n "${PREVIOUS_MANIFEST:-}" ]; then args+=(--previous "$PREVIOUS_MANIFEST"); fi
          python scripts/build_public_reference_bundle.py --input-root inputs --output-dir dist/public-reference "${args[@]}"
          cat dist/public-reference/duplicate-audit/DUPLICATE_REPORT.md >> "$GITHUB_STEP_SUMMARY"
          echo 'AU/US excluded. Source reference candidate only; no clinical runtime activation, signing or Release.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: PUBLIC-REFERENCE-UNREVIEWED-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/public-reference/PUBLIC-REFERENCE-UNREVIEWED.tar.gz
            dist/public-reference/archive-sha256.json
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: PUBLIC-REFERENCE-MANIFEST
          path: |
            dist/public-reference/manifest.json
            dist/public-reference/APP_SOURCE_CATALOG.json
            dist/public-reference/archive-sha256.json
          retention-days: 90
          if-no-files-found: error
